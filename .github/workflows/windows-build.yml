name: Windows .NET validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-mcp-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore bridge
        run: dotnet restore src/AlexaBridge/AlexaBridge.csproj
      - name: Restore simulator
        run: dotnet restore src/AlexaSimulator/AlexaSimulator.csproj
      - name: Build bridge
        run: dotnet build src/AlexaBridge/AlexaBridge.csproj --configuration Release --no-restore
      - name: Build simulator
        run: dotnet build src/AlexaSimulator/AlexaSimulator.csproj --configuration Release --no-restore
      - name: Build graphical Windows companion
        run: dotnet build src/AlexaDesktop/AlexaDesktop.csproj --configuration Release
      - name: Real MCP SDK client/server smoke test
        run: python scripts/run-protocol-smoke.py --ui
      - name: Permission, cancellation and persistence regression checks
        run: dotnet run --project tests/AlexaBridge.Checks/AlexaBridge.Checks.csproj --configuration Release
      - name: Prepare framework-dependent Windows preview
        run: ./scripts/package-windows.ps1
      - name: Parse PowerShell entrypoints
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $scriptTokens = $null
            $scriptErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$scriptTokens, [ref]$scriptErrors) | Out-Null
            if ($scriptErrors.Count) { throw ($scriptErrors | Out-String) }
          }
      - name: Validate the actual published package over MCP
        run: python scripts/run-protocol-smoke.py --package-root artifacts/windows-preview --ui
      - name: Verify extracted-package launcher and cleanup
        run: python scripts/test-windows-launcher.py --package-root artifacts/windows-preview
      - uses: actions/upload-artifact@v4
        with:
          name: windows-development-preview
          path: artifacts/windows-preview
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-control-render
          path: artifacts/ui/**/*.png
          if-no-files-found: warn

