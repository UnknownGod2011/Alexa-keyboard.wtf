name: Windows .NET validation
on:
  push:
    branches: [main, codex/alexa-plus-completion]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/AlexaBridge/AlexaBridge.csproj
      - name: Build
        run: dotnet build src/AlexaBridge/AlexaBridge.csproj --configuration Release --no-restore
